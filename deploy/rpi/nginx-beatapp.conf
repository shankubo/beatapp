# Beatapp servi sous https://app.francotamouls.com/beatapp/
#
# A inclure dans le bloc `server` existant du domaine, PAS a la place: il sert
# probablement autre chose a la racine.
#
#   server {
#       server_name app.francotamouls.com;
#       listen 443 ssl;
#       # ... certificats existants ...
#       include /etc/nginx/snippets/beatapp.conf;
#   }
#
# Ce nginx-ci ne sert aucun fichier: il relaie vers le conteneur, qui porte sa
# propre configuration (en-tetes WebCodecs, cache, compression). Les regles
# vivent ainsi avec le code qu'elles servent, et un `docker compose pull` les
# met a jour comme le reste.

location /beatapp/ {
    # Port publie par le conteneur sur la boucle locale. A ajuster si 8080
    # etait deja pris sur cette machine — voir BEATAPP_PORT dans le compose.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Le conteneur ecoute en clair: sans cet en-tete, une application qui
    # construirait une URL absolue la produirait en http.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Les en-tetes du conteneur sont transmises telles quelles. Ne PAS ajouter
    # de `add_header` ici: nginx remplacerait alors la liste entiere renvoyee
    # par le conteneur, et l'isolation cross-origin exigee par WebCodecs
    # sauterait — l'export MP4 echouerait a la toute fin du parcours.
}

# Sans barre finale, les URL relatives se resoudraient depuis la racine du
# domaine. La redirection est faite ici plutot que dans le conteneur, pour
# qu'elle porte le bon nom d'hote.
location = /beatapp {
    return 301 /beatapp/;
}
