# Beatapp servi sous https://app.francotamouls.com/beatapp/
#
# ATTENTION — ce domaine REDIRIGE tout vers app.saisietemps.fr. Le bloc `server`
# existant se termine aujourd'hui par :
#
#     return 301 https://app.saisietemps.fr$request_uri;
#
# Ce `return` au niveau du `server` s'applique a TOUTE requete, y compris
# /beatapp/. Il faut donc le deplacer dans un `location /` pour qu'il devienne
# le cas par defaut, et non plus une regle qui court-circuite tout.
#
# Le bloc HTTPS de app.francotamouls.com doit devenir :
#
#     server {
#         listen 443 ssl;
#         listen [::]:443 ssl;
#         server_name app.francotamouls.com;
#
#         ssl_certificate /etc/ssl/certs/cloudflare-francotamouls.com.bundle.crt;
#         ssl_certificate_key /etc/ssl/private/cloudflare-francotamouls.com.key;
#         ssl_protocols TLSv1.2 TLSv1.3;
#         ssl_ciphers HIGH:!aNULL:!MD5;
#
#         include /etc/nginx/snippets/beatapp.conf;   # <-- ajoute
#
#         # Le `return` passe ICI, dans un location: sans ce deplacement,
#         # /beatapp/ serait redirige comme le reste et l'application
#         # resterait inaccessible.
#         location / {
#             return 301 https://app.saisietemps.fr$request_uri;
#         }
#     }
#
# Le bloc HTTP (port 80) n'a pas a changer: il redirige vers HTTPS, ce qui est
# le comportement voulu pour Beatapp aussi.
#
# Ce nginx-ci ne sert aucun fichier: il relaie vers le conteneur, qui porte sa
# propre configuration (en-tetes WebCodecs, cache, compression). Les regles
# vivent ainsi avec le code qu'elles servent, et un `docker compose pull` les
# met a jour comme le reste.

location /beatapp/ {
    # Port publie par le conteneur sur la boucle locale. A ajuster si 8080
    # etait deja pris sur cette machine — voir BEATAPP_PORT dans le compose.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Le conteneur ecoute en clair: sans cet en-tete, une application qui
    # construirait une URL absolue la produirait en http.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Les en-tetes du conteneur sont transmises telles quelles. Ne PAS ajouter
    # de `add_header` ici: nginx remplacerait alors la liste entiere renvoyee
    # par le conteneur, et l'isolation cross-origin exigee par WebCodecs
    # sauterait — l'export MP4 echouerait a la toute fin du parcours.
}

# Sans barre finale, les URL relatives se resoudraient depuis la racine du
# domaine. `= /beatapp` est une correspondance EXACTE: elle a priorite sur le
# `location /` de redirection, qui sinon happerait cette URL.
location = /beatapp {
    return 301 https://$host/beatapp/;
}
