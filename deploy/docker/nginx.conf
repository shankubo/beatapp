# nginx interne au conteneur.
#
# Il sert Beatapp sous /beatapp/ en clair sur le port 8080. Le TLS et le nom de
# domaine sont l'affaire du reverse proxy de l'hote (le nginx du Raspberry Pi),
# qui possede deja le certificat de app.francotamouls.com — le dupliquer ici
# obligerait a le renouveler a deux endroits.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Racine du conteneur: redirige vers l'application. Utile pour tester
    # l'image seule, sans reverse proxy devant.
    location = / {
        return 301 /beatapp/;
    }

    # Sans barre finale, les URL relatives se resoudraient depuis la racine.
    location = /beatapp {
        return 301 /beatapp/;
    }

    location /beatapp/ {
        # Repli sur l'index: l'application n'a qu'une page, la navigation est
        # geree cote client.
        try_files $uri $uri/ /beatapp/index.html;

        # --- En-tetes exiges par WebCodecs ---
        #
        # `SharedArrayBuffer` et une partie des API de decodage ne sont
        # disponibles qu'en contexte « cross-origin isolated ». Sans ces deux
        # en-tetes, l'export MP4 echoue sur certains navigateurs — un defaut qui
        # n'apparait qu'a la toute fin du parcours, apres tout le montage.
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # `frame-ancestors` ici et non dans un <meta>: le navigateur ignore
        # cette directive quand elle est delivree par balise.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Les assets portent une empreinte dans leur nom (index-CxdyfeoM.js): leur
    # contenu ne change jamais a nom egal, donc on peut les figer un an.
    #
    # Les en-tetes d'isolation sont REPETEES: nginx remplace la liste entiere
    # des `add_header` des qu'un bloc imbrique en declare un, et les omettre
    # ferait perdre l'isolation sur les fichiers les plus demandes.
    location ~* ^/beatapp/assets/.*\.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # L'index et le service worker ne doivent JAMAIS etre caches: c'est par eux
    # que la mise a jour arrive. Un `sw.js` cache une journee laisserait les
    # visiteurs sur l'ancienne version malgre le deploiement.
    location = /beatapp/index.html {
        # Meme raison que `sw.js`: l'index porte les noms haches des bundles,
        # donc une copie perimee ancre le navigateur sur l'ancienne version.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, s-maxage=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    # Le service worker n'est JAMAIS mis en cache, ni par le navigateur ni par
    # un CDN.
    #
    # Mesure sur la production: `no-cache` seul ne suffisait pas — Cloudflare
    # renvoyait `max-age=14400` (4 h) et servait `sw.js` depuis son cache. Or
    # c'est PAR ce fichier que la mise a jour arrive: `registration.update()`
    # recuperait une copie perimee, ne voyait aucun changement, et l'application
    # annoncait « a jour » alors qu'une nouvelle version etait deployee — un
    # mensonge pire qu'une absence de bouton.
    #
    # `no-store` interdit la conservation, et les directives CDN (`s-maxage=0`,
    # `proxy-revalidate`) valent pour les intermediaires qui ignorent le reste.
    location = /beatapp/sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, s-maxage=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
